<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#28241f" />
  <meta name="description" content="Gestor de catálogo de Pollos Sabroson." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap" rel="stylesheet" />
  <title>Gestor de catálogo — Pollos Sabroson</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

<header class="admin-page-header">
  <div class="container">
    <a href="index.html" class="brand-link">
      <div class="brand-mark brand-mark-light" aria-label="Pollos Sabroson">
        <span class="brand-mark-icon" data-icon="flame" data-size="18" data-stroke="2.6"></span>
        <span class="brand-copy"><strong>pollos</strong><em>sabroson</em></span>
      </div>
    </a>
    <div style="display:flex; gap:10px; align-items:center;">
      <a href="index.html" class="outline-button">Ver tienda</a>
      <button id="btnLogout" class="primary-button">Cerrar sesión</button>
    </div>
  </div>
</header>

<!-- Bloqueo para quien no sea administrador -->
<div class="admin-gate" id="gate">Verificando acceso…</div>

<div class="admin-page" id="adminContent" hidden>
  <div class="container">

    <!-- ============ Marca y colores ============ -->
    <div class="admin-card">
      <h3>Nombre, título y colores</h3>
      <div class="field-row">
        <div class="field">
          <label>Nombre del negocio</label>
          <input type="text" id="nombreNegocioInput" placeholder="Pollos Sabroson" />
        </div>
        <div class="field">
          <label>Título de la portada (usa | para el salto de línea)</label>
          <input type="text" id="esloganInput" placeholder="El sabor que|une a la familia." />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Color principal</label>
          <div class="color-field-row">
            <input type="color" id="colorPrimarioPick" value="#e65636" />
            <input type="text" id="colorPrimarioInput" value="#e65636" spellcheck="false" />
          </div>
        </div>
        <div class="field">
          <label>Color secundario</label>
          <div class="color-field-row">
            <input type="color" id="colorSecundarioPick" value="#e9ab35" />
            <input type="text" id="colorSecundarioInput" value="#e9ab35" spellcheck="false" />
          </div>
        </div>
        <div class="field">
          <label>Color oscuro</label>
          <div class="color-field-row">
            <input type="color" id="colorOscuroPick" value="#28241f" />
            <input type="text" id="colorOscuroInput" value="#28241f" spellcheck="false" />
          </div>
        </div>
        <div class="field">
          <label>Color de fondo</label>
          <div class="color-field-row">
            <input type="color" id="colorFondoPick" value="#fffdfa" />
            <input type="text" id="colorFondoInput" value="#fffdfa" spellcheck="false" />
          </div>
        </div>
      </div>
      <button class="primary-button" id="btnGuardarMarca">Guardar marca y colores</button>
    </div>

    <!-- ============ Portada e imagen QR ============ -->
    <div class="admin-card">
      <h3>Portada del inicio y QR de pago</h3>
      <div class="field-row">
        <div class="field">
          <label>URL de la imagen de portada</label>
          <input type="text" id="heroUrlInput" placeholder="https://..." />
        </div>
        <div class="field">
          <label>O sube un archivo</label>
          <input type="file" id="heroFileInput" accept="image/*" />
        </div>
      </div>
      <button class="primary-button" id="btnGuardarHero">Guardar portada</button>

      <hr style="margin:24px 0; border:none; border-top:1px solid var(--line);" />

      <div class="field-row">
        <div class="field">
          <label>URL de la imagen QR de pago</label>
          <input type="text" id="qrUrlInput" placeholder="https://..." />
        </div>
        <div class="field">
          <label>O sube un archivo</label>
          <input type="file" id="qrFileInput" accept="image/*" />
        </div>
      </div>
      <button class="primary-button" id="btnGuardarQr">Guardar QR</button>
    </div>

    <!-- ============ Formulario de producto ============ -->
    <div class="admin-card">
      <h3 id="formTitle">Nuevo producto</h3>
      <div id="productoMsg"></div>
      <form id="formProducto">
        <input type="hidden" name="id" />
        <div class="field-row">
          <div class="field"><label>Nombre</label><input type="text" name="nombre" required /></div>
          <div class="field">
            <label>Categoría</label>
            <select name="categoria" required>
              <option value="brasa">Pollo a la brasa</option>
              <option value="broaster">Pollo broaster</option>
              <option value="lomito">Lomito</option>
              <option value="hamburguesa">Hamburguesa</option>
              <option value="bebida">Bebida</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Tamaño / clave interna</label><input type="text" name="tamano_clave" placeholder="cuarto, entero..." /></div>
          <div class="field"><label>Tamaño visible</label><input type="text" name="tamano_etiqueta" placeholder="Cuarto de pollo" /></div>
        </div>
        <div class="field"><label>Descripción</label><textarea name="descripcion" rows="2"></textarea></div>
        <div class="field-row">
          <div class="field"><label>Precio (Bs)</label><input type="number" step="0.01" name="precio" required /></div>
          <div class="field"><label>Stock</label><input type="number" name="stock" required value="99" /></div>
        </div>
        <div class="field"><label>Etiqueta destacada (opcional)</label><input type="text" name="etiqueta" placeholder="Favorito, Más pedido..." /></div>
        <div class="field-row">
          <div class="field"><label>URL de imagen</label><input type="text" name="imagen_url" /></div>
          <div class="field"><label>O sube un archivo</label><input type="file" name="imagen_file" accept="image/*" /></div>
        </div>
        <div class="field">
          <label style="text-transform:none; letter-spacing:0; font-size:13px; color:var(--ink);">
            <input type="checkbox" name="disponible" checked style="width:auto; display:inline-block; margin-right:7px;" />
            Disponible en el menú
          </label>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="primary-button" type="submit">Guardar producto</button>
          <button class="outline-button" type="button" id="btnCancelarEdicion" hidden>Cancelar edición</button>
        </div>
      </form>
    </div>

    <!-- ============ Tabla de productos ============ -->
    <div class="admin-header">
      <h3>Catálogo actual</h3>
      <button class="outline-button" id="btnRecargar">Actualizar</button>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Imagen</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Estado</th><th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaProductos"></tbody>
      </table>
    </div>

  </div>
</div>

<div id="toastRoot"></div>

<script src="./js/supabase.js"></script>
<script src="./js/icons.js"></script>
<script src="./js/supabaseClient.js"></script>
<!-- config.js: mismos valores manuales de fondo y ubicación que usa index.html,
     para que el panel admin muestre los mismos valores por defecto. -->
<script src="./js/config.js"></script>
<script src="./js/data.js"></script>
<script src="./js/adminCrud.js"></script>
</body>
</html>
